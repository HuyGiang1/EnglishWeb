spring:
  application:
    name: englishflow-backend

  profiles:
    active: dev

  web:
    resources:
      add-mappings: false

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/englishflow}
    username: ${SPRING_DATASOURCE_USERNAME:englishflow}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EnglishFlowHikariCP
      minimum-idle: 2
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false # set to true in production SSL/TLS profile
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: when_authorized

englishflow:
  media:
    production-mode: ${ENGLISHFLOW_PRODUCTION_MODE:false}
    strict-startup-check: ${ENGLISHFLOW_STRICT_AUDIO_CHECK:false}

